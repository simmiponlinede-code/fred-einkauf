# Holt jeden Montag früh die Angebote der Woche und schreibt sie nach Supabase.
# Kosten: 0 € (ca. 1–2 Minuten von 2.000 Freiminuten im Monat).
name: Angebote importieren

on:
  schedule:
    - cron: "17 4 * * 1" # Montag 05:17 Uhr MEZ (GitHub rechnet in UTC)
  workflow_dispatch:
    inputs:
      stores:
        description: "Nur bestimmte Märkte, z. B. aldi-nord,kaufland (leer = alle)"
        required: false
      push:
        description: "Push-Nachricht an eure Handys schicken"
        type: boolean
        default: true

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx tsx scripts/import/run.ts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          KAUFLAND_STORE_URL: ${{ vars.KAUFLAND_STORE_URL }}
          IMPORT_STORES: ${{ inputs.stores }}
          SEND_PUSH: ${{ github.event_name == 'schedule' || inputs.push }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
